<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNHL - Minecraft Hockey League</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-color: #1a1a1e;
            --accent-color: #00bcc6;
            --text-color: #ffffff;
            --text-muted: #a0a0a5;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--card-color);
            padding: 15px 30px;
            border-bottom: 2px solid #2a2a30;
        }
        nav .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }
        nav .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        .card {
            background-color: var(--card-color);
            border-radius: 8px;
            padding: 25px;
            border: 1px solid #2a2a30;
        }
        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 1px solid #2a2a30;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #2a2a30;
        }
        th { color: var(--text-muted); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: var(--text-muted); }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #121214;
            border: 1px solid #3a3a42;
            color: white;
            border-radius: 4px;
        }
        button {
            background-color: var(--accent-color);
            color: black;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">🏒 MNHL LEAGUE</div>
        <div class="nav-links">
            <a href="#">Standings</a>
            <a href="#">Rosters</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h2>League Standings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Team Name</th>
                        <th>Wins</th>
                        <th>Losses</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><strong>Nether Ice Kings</strong></td>
                        <td>0</td>
                        <td>0</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <h2>Admin Score Reporter</h2>
            <div class="form-group">
                <label>Home Team</label>
                <input type="text" id="homeTeam">
            </div>
            <div class="form-group">
                <label>Home Score</label>
                <input type="number" id="homeScore">
            </div>
            <div class="form-group">
                <label>Away Team</label>
                <input type="text" id="awayTeam">
            </div>
            <div class="form-group">
                <label>Away Score</label>
                <input type="number" id="awayScore">
            </div>
            <button onclick="alert('Website is live! We will connect the bot next.')">Broadcast Score</button>
        </div>
    </div>

</body>
</html>
