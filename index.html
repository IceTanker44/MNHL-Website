        <!-- Weekly Schedule Notice Board -->
        <div class="card">
            <div>
                <h2 class="sched-title">📅 Matchday Scheduler</h2>
                <div class="form-group">
                    <label>Schedule Title</label>
                    <input type="text" id="schedDate" placeholder="e.g., Pre-Season Schedule">
                </div>
                <div class="form-group">
                    <label>Games List (Format: Game 1 | Matchup)</label>
                    <textarea id="schedGames" style="height: 120px;" placeholder="Game 1 | Renegades @ Maple Leafs&#10;Game 2 | Krakens @ Kings"></textarea>
                </div>
            </div>
            <button class="btn-sched" onclick="sendData('/api/schedule', { 
                dateTitle: document.getElementById('schedDate').value, 
                gamesList: document.getElementById('schedGames').value 
            })">Post Schedule Board</button>
        </div>

        <!-- NEW: Active Game Day Announcer -->
        <div class="card">
            <div>
                <h2 style="color: #ff5555;">🎮 Game Day Broadcaster</h2>
                <div class="form-group">
                    <label>Today's Banner / Notice</label>
                    <input type="text" id="gdTitle" placeholder="e.g., Pre-Season Game Day!">
                </div>
                <div class="form-group">
                    <label>Active Games Today (One per line)</label>
                    <textarea id="gdGames" style="height: 120px;" placeholder="Renegades @ Kings&#10;Maple Leafs @ Krakens"></textarea>
                </div>
            </div>
            <button style="background-color: #ff5555; color: white;" onclick="sendData('/api/gameday', { 
                title: document.getElementById('gdTitle').value, 
                games: document.getElementById('gdGames').value 
            })">Broadcast Game Day</button>
        </div>
